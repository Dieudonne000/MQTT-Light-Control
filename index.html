<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Light Control</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="light-off">
    <div class="container">
        <h1>MQTT Light Control</h1>
        <div class="light-indicator">
            <div class="bulb" id="bulb">
                <div class="glow"></div>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-on" onclick="sendMessage('ON')">
                <span class="btn-icon">💡</span>
                <span class="btn-text">Turn ON</span>
            </button>
            <button class="btn btn-off" onclick="sendMessage('OFF')">
                <span class="btn-icon">🌙</span>
                <span class="btn-text">Turn OFF</span>
            </button>
        </div>
        <p id="status" class="status">Last Command: None</p>
    </div>

    <script>
        const client = mqtt.connect("wss://test.mosquitto.org:8081"); // MQTT over WebSockets
        const bulb = document.getElementById("bulb");
        const body = document.body;

        client.on("connect", function () {
            console.log("Connected to MQTT broker");
        });

        function sendMessage(command) {
            client.publish("/student_group/light_control", command);
            document.getElementById("status").innerText = `Last Command: ${command}`;
            
            // Update bulb visual and theme
            if (command === 'ON') {
                bulb.classList.add('on');
                body.classList.remove('light-off');
                body.classList.add('light-on');
            } else {
                bulb.classList.remove('on');
                body.classList.remove('light-on');
                body.classList.add('light-off');
            }
        }
    </script>
</body>
</html>
